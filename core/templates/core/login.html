<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Controle Financeiro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-xl shadow-md border border-gray-200 overflow-hidden">
        <div class="bg-teal-700 text-white p-6 text-center">
            <h1 class="text-2xl font-bold">Controle Financeiro</h1>
            <p class="text-teal-100 text-sm mt-1">Acesse sua conta para continuar</p>
        </div>

        <div class="p-6">
            {% if messages %}
                {% for message in messages %}
                    <div class="mb-4 p-3 rounded text-xs font-semibold bg-rose-100 text-rose-700 border border-rose-200">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST" action="{% url 'login' %}" class="space-y-4">
                {% csrf_token %}

                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Usuário</label>
                    <input type="text" name="username" required placeholder="Seu nome de usuário"
                        class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-teal-600">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Senha</label>
                    <input type="password" name="password" required placeholder="••••••••"
                        class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-teal-600">
                </div>

                <button type="submit"
                    class="w-full bg-teal-700 hover:bg-teal-800 text-white font-semibold py-2.5 rounded text-sm transition shadow">
                    Entrar
                </button>
            </form>

            <div class="mt-6 text-center text-xs text-gray-500">
                Ainda não tem uma conta? 
                <a href="{% url 'register' %}" class="text-teal-700 font-semibold hover:underline">Cadastre-se</a>
            </div>
        </div>
    </div>

</body>
</html>
